<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Eligibility Check</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/donor.css') }}">
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</head>
<body>
    <div class="container">
        <!-- Image Section -->
        <div class="image-section">
            <img src="{{ url_for('static', filename='images/page1_doner.png') }}" alt="Donor Image">
        </div>

        <!-- Form Section -->
        <div class="form-container">
            <h2>Blood Donation Eligibility Check</h2>

            {% if result %}
                <div class="result">
                    <p>{{ result }}</p>
                </div>
            {% endif %}

            <!-- Step 1: Basic Details -->
            <!-- Step 1: Basic Details -->
<div id="basic-details-form">
    <form method="POST">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required>

        <label for="weight">Weight (in kg):</label>
        <input type="number" id="weight" name="weight" required>

        <label for="blood_group">Blood Group:</label>
        <select id="blood_group" name="blood_group" required>
            <option value="" disabled selected>Select your blood group</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select>

        <button type="submit">Next</button>
    </form>
</div>


            <!-- Step 2: Health Questions (Hidden initially) -->
            <div id="health-questions-form" style="display: none;">
                <form method="POST" action="/eligibility">
                    <h3>Health Questions</h3>

                    <label for="fever">Have you been sick in the last 7 days? (Yes/No):</label>
                    <input type="text" id="fever" name="fever" required>

                    <div id="fever-details" style="display:none;">
                        <label for="fever_type">If Yes, was it a mild fever or severe illness? (Mild/Severe):</label>
                        <input type="text" id="fever_type" name="fever_type">
                    </div>

                    <label for="surgery">Have you undergone surgery in the last 6 months? (Yes/No):</label>
                    <input type="text" id="surgery" name="surgery" required>

                    <label for="blood_thinners">Do you take any blood thinners or medications? (Yes/No):</label>
                    <input type="text" id="blood_thinners" name="blood_thinners" required>

                    <label for="chronic_condition">Do you have any chronic medical conditions? (Yes/No):</label>
                    <input type="text" id="chronic_condition" name="chronic_condition" required>

                    <div id="chronic-condition-details" style="display:none;">
                        <label for="condition_management">Is your condition being actively managed? (Yes/No):</label>
                        <input type="text" id="condition_management" name="condition_management">
                    </div>

                    <label for="pregnancy">Are you currently pregnant or breastfeeding? (Yes/No):</label>
                    <input type="text" id="pregnancy" name="pregnancy" required>

                    <button type="submit">Check Eligibility</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Handle visibility of form sections based on user input
        document.getElementById('fever').addEventListener('input', function() {
            var fever = document.getElementById('fever').value.toLowerCase();
            if (fever === 'yes') {
                document.getElementById('fever-details').style.display = 'block';
            } else {
                document.getElementById('fever-details').style.display = 'none';
            }
        });

        document.getElementById('chronic_condition').addEventListener('input', function() {
            var chronicCondition = document.getElementById('chronic_condition').value.toLowerCase();
            if (chronicCondition === 'yes') {
                document.getElementById('chronic-condition-details').style.display = 'block';
            } else {
                document.getElementById('chronic-condition-details').style.display = 'none';
            }
        });

        {% if show_health_form %}
        // Show health questions form after basic details submission
        document.getElementById('basic-details-form').style.display = "none";
        document.getElementById('health-questions-form').style.display = "block";
        {% endif %}
    </script>
</body>
</html>
