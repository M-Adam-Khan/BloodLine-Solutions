<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find a Donor - Bloodline Solutions</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>

    <!-- TITLE SECTION -->
    <div class="title-section">
        <h1>Welcome to Bloodline Solutions</h1>
        <p>Find a blood donor and save lives!</p>
    </div>

    <!-- FORM CONTAINER -->
    <div class="container">
        <form action="{{ url_for('search_donor') }}" method="GET" class="search-form">
            <label for="blood-group">Blood Group:</label>
            <select id="blood-group" name="blood-group" required>
                <option value="">Select Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>

            <label for="city">City:</label>
            <input type="text" id="city" name="city" placeholder="Enter your city" required>

            <!-- ✅ BUTTON INSIDE FORM -->
            <button type="submit" class="btn search-btn">Search Donors</button>
        </form>
    </div>

</body>
</html>
